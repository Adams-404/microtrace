name: Build & Release Microtrace

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Microtrace
    # Run only if commit message contains 'release' or workflow is manually dispatched
    if: "contains(github.event.head_commit.message, 'release') || github.event_name == 'workflow_dispatch'"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Formatting & Static Analysis
        run: |
          dart format --output=none --set-exit-if-changed .
          flutter analyze

      - name: Run Test Suite
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Build Web Bundle
        run: flutter build web --release

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: microtrace-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: microtrace-web-bundle
          path: build/web/
          retention-days: 14
