name: Build & Release Microtrace

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test & publish APK
    # Run on a version tag, a manual dispatch, or any push to main whose commit
    # message contains "release".
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      contains(github.event.head_commit.message, 'release')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pin to the version the project is developed against so CI, the
          # Gradle wrapper and the Android Gradle Plugin stay compatible.
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Formatting & Static Analysis
        run: |
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze

      - name: Run Test Suite
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Build Web Bundle
        run: flutter build web --release

      - name: Stage Release Files
        id: apk
        shell: bash
        run: |
          VERSION=$(awk '/^version:/ {print $2}' pubspec.yaml | cut -d+ -f1)
          APK="microtrace-${VERSION}-${GITHUB_RUN_NUMBER}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$APK" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Resolve Release Tag
        id: meta
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "name=MICROTRACE $GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "name=MICROTRACE latest build" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          prerelease: false
          files: ${{ steps.apk.outputs.path }}
          body: |
            Automated MICROTRACE release built from `${{ github.sha }}`.

            | | |
            | --- | --- |
            | Version | `${{ steps.apk.outputs.version }}` |
            | APK | `${{ steps.apk.outputs.path }}` (${{ steps.apk.outputs.size }}) |
            | Commit | `${{ github.sha }}` |
            | Trigger | `${{ github.event_name }}` |

            **Install on Android:** download the `.apk` below on the phone and open it.
            You may need to allow installs from your browser or file manager.

            This is a test build signed with the debug keystore. It runs entirely
            offline and expects an optional local model server at
            `http://127.0.0.1:8080/v1` (Clearport / llama.cpp in Termux).

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: microtrace-android-release
          path: ${{ steps.apk.outputs.path }}
          retention-days: 14

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: microtrace-web-bundle
          path: build/web/
          retention-days: 14
